[keyfile]
# usb0 is the debug gadget (static IP), wlan1/p2p0 are qcacld helper interfaces.
unmanaged-devices=interface-name:usb0;interface-name:wlan1;interface-name:p2p0;interface-name:wifi-aware0

[device]
# qcacld-3.0 on this kernel misbehaves with randomised scan MACs.
wifi.scan-rand-mac-address=no
