# The panel is 1080x2400 portrait. For landscape, add
#   Option "Rotate" "CW"
# here and set the touchscreen matrix in 20-exinux-touch.conf to match.
Section "Device"
    Identifier "exynos-decon"
    Driver     "fbdev"
    Option     "fbdev"    "/dev/fb0"
    Option     "ShadowFB" "on"
EndSection

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
