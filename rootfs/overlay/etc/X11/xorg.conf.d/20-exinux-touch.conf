Section "InputClass"
    Identifier       "exinux touchscreen"
    MatchIsTouchscreen "on"
    Driver           "libinput"
    # Rotation helpers (uncomment one together with Option "Rotate" in 10-exinux-fbdev.conf):
    # CW:  Option "CalibrationMatrix" "0 1 0 -1 0 1 0 0 1"
    # CCW: Option "CalibrationMatrix" "0 -1 1 1 0 0 0 0 1"
EndSection
