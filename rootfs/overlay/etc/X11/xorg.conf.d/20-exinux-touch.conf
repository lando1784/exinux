# Xorg runs on the exynos-decon DRM device (modesetting driver). To rotate:
#   xrandr -o right   and uncomment the matching matrix below.
Section "InputClass"
    Identifier       "exinux touchscreen"
    MatchIsTouchscreen "on"
    Driver           "libinput"
    # right (CW): Option "CalibrationMatrix" "0 1 0 -1 0 1 0 0 1"
    # left (CCW): Option "CalibrationMatrix" "0 -1 1 1 0 0 0 0 1"
EndSection
